<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HydroTransfer：全球流域地图、只读数据立方体、多来源洪水证据与研究报告。">
  <meta name="theme-color" content="#ffffff">
  <title>HydroTransfer · 流域研究平台</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261110-workflow100"><link rel="stylesheet" href="cube-viewer.css?v=20261110-workflow100"><link rel="stylesheet" href="results-redesign.css?v=20261110-workflow100"><link rel="stylesheet" href="report-viewer.css?v=20261110-workflow100">
  <link rel="stylesheet" href="global-results.css?v=20261110-workflow100">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#overview" data-view="overview" aria-label="HydroTransfer 首页"><svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 2C9 10 3 15 3 21a11 11 0 0022 0c0-6-6-11-11-19Z"/><path d="M6 20c6-5 10 5 17-1M6 25c6-4 11 4 15-1"/></svg><span>HydroTransfer</span></a>
    <nav class="primary-nav" aria-label="主导航">
      <button data-view="overview">流域地图</button><button data-view="data">数据立方体</button><button data-view="results">研究结果</button><button data-view="reports">报告与判定</button><button data-view="simulation">参数模拟</button>
    </nav>
    <div class="header-actions"><a class="text-link" href="https://github.com/LENS-AI4S/hydrotransfer-demo" target="_blank" rel="noopener noreferrer">GitHub ↗</a><button class="icon-button" id="appMenuButton" aria-label="更多操作" aria-expanded="false">···</button><div class="app-menu" id="appMenu" hidden><button id="sourceBtn">数据来源</button><button data-view="workflow">处理流程</button><button data-view="inputs">本地输入登记</button><button id="exportProject">导出当前配置</button><button id="importBoundary">导入边界</button><button id="aboutBtn">关于平台</button></div></div>
  </header>
  <main class="main">
    <section id="overviewView" aria-label="流域地图工作区">
      <div class="map-topbar">
        <div class="map-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5"/></svg><input id="basinSearch" type="search" placeholder="搜索流域名称或编号" aria-label="搜索流域名称或 HYBAS_ID" autocomplete="off"><div id="searchResults" class="search-results" hidden></div></div>
        <div class="map-filter"><label for="mapRegion">区域</label><select id="mapRegion" aria-label="地图区域"><option value="auto">按视图载入</option><option value="1">非洲</option><option value="2">欧洲和中东</option><option value="3">西伯利亚</option><option value="4">亚洲</option><option value="5">澳大利亚和大洋洲</option><option value="6">南美洲</option><option value="7">北美洲</option><option value="8">加拿大北部</option><option value="9">格陵兰</option></select></div>
        <div class="map-filter"><label for="areaFilter">上游面积</label><select id="areaFilter" aria-label="按累计上游面积筛选"><option value="all">不限</option><option value="up200_3000">200–3000 km²</option></select></div>
        <span class="dataset-source">HydroBASINS · Level 8 <button class="help-button" id="orderHelp" aria-label="层级与面积口径说明">ⓘ</button></span>
      </div>
      <div id="pickerNotice" class="picker-notice" hidden><span>点击地图中的分区，或输入流域编号。</span><button class="button small" id="finishBasinPick">使用当前流域</button><button class="text-button" id="cancelBasinPick">取消</button></div>
      <div class="map-workspace">
        <section class="map-card" aria-label="全球流域地图">
          <div class="map-stage" id="mapStage">
            <svg id="worldMap" role="img" aria-label="可交互流域地图，支持点选、拖动和缩放" viewBox="0 0 1100 600"></svg>
            <div class="map-loading" id="mapLoading">正在准备地图…</div>
            <div class="map-view-controls"><button id="worldView" class="map-tab active">全球</button><button id="basinView" class="map-tab">当前流域</button></div>
            <div class="map-controls"><button id="zoomIn" aria-label="放大地图">+</button><button id="zoomOut" aria-label="缩小地图">−</button><button id="resetMap" aria-label="重置全球视图">⌖</button></div>
            <div class="map-layer-control"><button id="layersBtn" class="button small" aria-expanded="false">图层</button><div class="layers-popover" id="layersPopover" hidden><label><input type="checkbox" id="basinToggle" checked> 流域边界</label><label><input type="checkbox" id="riverToggle" checked> 河网</label><label><input type="checkbox" id="markerToggle"> 大流域定位</label><button class="text-button" id="mapSources">来源与精度说明</button></div></div>
            <div class="map-legend"><span><i class="legend-current"></i>当前</span><span><i class="legend-upstream"></i>上游</span><span><i class="legend-downstream"></i>下游</span><span><i class="legend-river"></i>河网</span></div>
            <div class="map-coordinate" id="mapCoordinate"></div><div id="mapTooltip" class="map-tooltip" hidden></div>
          </div>
          <div class="map-footer"><span id="visibleBasinCount">全球 190,675 个分区</span><span id="mapLoadStatus" role="status"></span></div>
        </section>
        <aside class="basin-detail" id="basinDetail" aria-label="当前流域详情"></aside>
      </div>
      <div class="map-context-row"><label for="referenceSelect">大流域定位 <select id="referenceSelect"><option value="">选择参考范围</option><option value="yangtze">长江</option><option value="mekong">湄公河</option><option value="rhine">莱茵河</option><option value="amazon">亚马孙</option><option value="mississippi">密西西比河</option><option value="congo">刚果河</option></select></label><span id="boundaryQualityNote">边界为概化显示，计算使用原始数据。</span></div>
    </section>
    <section id="detailView" hidden></section>
  </main>
  <input type="file" id="boundaryFile" accept=".geojson,.json" hidden>
  <dialog id="infoDialog"><div class="dialog-header"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="dialogContent"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="assets/d3.min.js?v=20261110-workflow100"></script><script src="assets/topojson-client.min.js?v=20261110-workflow100"></script><script src="assets/hydrobasins-geo.js?v=20261110-workflow100"></script><script src="assets/basin-seed.js?v=20261110-workflow100"></script><script src="assets/basin-native-pilots.js?v=20261110-workflow100"></script><script src="assets/catalog.js?v=20261110-workflow100"></script><script src="assets/resource-manifest.js?v=20261110-workflow100"></script><script src="asset-loader.js?v=20261110-workflow100"></script><script src="hydrobasins-canvas.js?v=20261110-workflow100"></script><script src="hydro-topology.js?v=20261110-workflow100"></script><script src="app-hydrobasins.js?v=20261110-workflow100"></script>
</body></html>
